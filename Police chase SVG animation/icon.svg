  <!-- Road -->
  <rect y="300" width="100%" height="100" fill="#444" />
  <g stroke="#FFF" stroke-width="4">
    <line x1="0" y1="350" x2="800" y2="350" stroke-dasharray="20,20" />
  </g>

  <!-- Civilian Traffic -->
  <g>
    <g transform="translate(100, 320)">
      <rect width="70" height="25" rx="5" ry="5" fill="#888" />
      <circle cx="15" cy="25" r="6" fill="#222" />
      <circle cx="55" cy="25" r="6" fill="#222" />
      <animateTransform attributeName="transform" type="translate" from="900 320" to="0 320" dur="10s" repeatCount="indefinite" />
    </g>
    <g transform="translate(300, 310)">
      <rect width="70" height="25" rx="5" ry="5" fill="#999" />
      <circle cx="15" cy="25" r="6" fill="#222" />
      <circle cx="55" cy="25" r="6" fill="#222" />
      <animateTransform attributeName="transform" type="translate" from="300 310" to="0 310" dur="6s" repeatCount="indefinite" />
    </g>
    <g transform="translate(500, 350)">
      <rect width="70" height="25" rx="5" ry="5" fill="#999" />
      <circle cx="15" cy="25" r="6" fill="#222" />
      <circle cx="55" cy="25" r="6" fill="#222" />
      <animateTransform attributeName="transform" type="translate" from="500 300" to="0 300" dur="7s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- Speeding Cars -->
  <g>
    <g>
      <rect width="80" height="30" rx="6" ry="6" fill="red" />
      <circle cx="15" cy="30" r="7" fill="#111" />
      <circle cx="65" cy="30" r="7" fill="#111" />
      <rect x="10" y="5" width="20" height="10" fill="#ccf" />
      <rect x="35" y="5" width="20" height="10" fill="#ccf" />
      <circle cx="0" cy="15" r="3" fill="yellow" />
      <circle cx="80" cy="15" r="3" fill="orange" />
      <animateTransform attributeName="transform" type="translate" from="900 290" to="0 350" dur="5s" repeatCount="indefinite" />
    </g>
    <g>
      <rect width="80" height="30" rx="6" ry="6" fill="#0073e6" />
      <circle cx="15" cy="30" r="7" fill="#111" />
      <circle cx="65" cy="30" r="7" fill="#111" />
      <rect x="10" y="5" width="20" height="10" fill="#ccf" />
      <rect x="35" y="5" width="20" height="10" fill="#ccf" />
      <circle cx="0" cy="15" r="3" fill="yellow" />
      <circle cx="80" cy="15" r="3" fill="orange" />
      <animateTransform attributeName="transform" type="translate" from="850 350" to="0 350" dur="6s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- Police Cars (Moving, No Effects) -->
  <g>
    <g>
      <rect width="80" height="30" fill="white" stroke="#000" stroke-width="1" />
      <circle cx="15" cy="30" r="7" fill="#111" />
      <circle cx="65" cy="30" r="7" fill="#111" />
      <rect x="10" y="5" width="20" height="10" fill="#ccf" />
      <rect x="35" y="5" width="20" height="10" fill="#ccf" />
      <!-- Police lights -->
     <rect x="30" y="-5" width="10" height="5" fill="red" />
     <rect x="40" y="-5" width="10" height="5" fill="blue" />
      <animateTransform attributeName="transform" type="translate" from="1100 340" to="0 340" dur="7.5s" repeatCount="indefinite" />
    </g>
    <g>
      <rect width="80" height="30" fill="white" stroke="#000" stroke-width="1" />
      <circle cx="15" cy="30" r="7" fill="#111" />
      <circle cx="65" cy="30" r="7" fill="#111" />
      <rect x="10" y="5" width="20" height="10" fill="#ccf" />
      <rect x="35" y="5" width="20" height="10" fill="#ccf" />
     <!-- Police lights -->
     <rect x="30" y="-5" width="10" height="5" fill="red" />
     <rect x="40" y="-5" width="10" height="5" fill="blue" />
      <animateTransform attributeName="transform" type="translate" from="1000 350" to="0 350" dur="7.5s" repeatCount="indefinite" />
    </g>
  </g>
